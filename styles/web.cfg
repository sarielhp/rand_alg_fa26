\Preamble{xhtml,mathjax,fn-in}

\Configure{@BODY}{\HCode{<div style="display:none">\(}%
  \special{t4ht*<styles/mathjax_macros.tex}%
  \HCode{\)</div>}}

\makeatletter
\IfFileExists{styles/master_labels.aux}{\input{styles/master_labels.aux}}{}
\makeatother

\makeatletter
\AtBeginDocument{%
  \def\HLink#1#2{\HCode{<a class="cross-ref" href="###2">}#1~\ref{#2}\HCode{</a>}}%
  \def\HLinkShort#1#2{\HCode{<a class="cross-ref" href="###2">}#1\ref{#2}\HCode{</a>}}%
  \def\HLinkSuffix#1#2#3{\HCode{<a class="cross-ref" href="###2">}#1\ref{#2}#3\HCode{</a>}}%
  \def\HLinkPage#1#2{\HLink{#1}{#2}}%
  \def\HLinkPageSuffix#1#2#3{\HLinkSuffix{#1}{#2}{#3}}%
  \def\defrefY#1#2{\HCode{<a class="cross-ref" href="##def:#2">}#1\HCode{</a>}}%
  \def\obsrefY#1#2{\HCode{<a class="cross-ref" href="##observation:#2">}#1\HCode{</a>}}%
  \def\lemrefY#1#2{\HCode{<a class="cross-ref" href="##lemma:#2">}#1\HCode{</a>}}%
  \def\secrefY#1#2{\HCode{<a class="cross-ref" href="##sec:#2">}#1\HCode{</a>}}%
  \def\thmrefY#1#2{\HCode{<a class="cross-ref" href="##theo:#2">}#1\HCode{</a>}}%
  \def\exeref#1{\HCode{<a class="cross-ref" href="##exer:#1">}Exercise~\ref{exer:#1}\HCode{</a>}}%
  \def\thmlab#1{\HCode{<a id="theo:#1"></a>}\label{theo:#1}}%
  \typeout{CFG_THMLAB_MEANING: \meaning\thmlab}%
  \def\lemlab#1{\HCode{<a id="lemma:#1"></a>}\label{lemma:#1}}%
  \def\seclab#1{\HCode{<a id="sec:#1"></a>}\label{sec:#1}}%
  \def\figlab#1{\leavevmode\HCode{<a id="fig:#1"></a>}\label{fig:#1}}%
  \def\deflab#1{\HCode{<a id="def:#1"></a>}\label{def:#1}}%
  \def\corlab#1{\HCode{<a id="cor:#1"></a>}\label{cor:#1}}%
  \def\clmlab#1{\HCode{<a id="claim:#1"></a>}\label{claim:#1}}%
  \def\obslab#1{\HCode{<a id="observation:#1"></a>}\label{observation:#1}}%
  \def\exmlab#1{\HCode{<a id="example:#1"></a>}\label{example:#1}}%
  \def\remlab#1{\HCode{<a id="rem:#1"></a>}\label{rem:#1}}%
  \def\itemlab#1{\HCode{<a id="item:#1"></a>}\label{item:#1}}%
  \def\tedlab#1{\HCode{<a id="tedium:#1"></a>}\label{tedium:#1}}%
  \def\factlab#1{\HCode{<a id="fact:#1"></a>}\label{fact:#1}}%
  \def\alglab#1{\HCode{<a id="algorithm:#1"></a>}\label{algorithm:#1}}%
  \def\exelab#1{\HCode{<a id="exer:#1"></a>}\label{exer:#1}}%
  \let\orig@label\label
  \def\label#1{\HCode{<a id="#1"></a>}\orig@label{#1}}%
}
\makeatother

